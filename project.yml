name: TrueRPCMini
options:
  bundleIdPrefix: com.truewebber
  generateEmptyDirectories: true
  developmentLanguage: en
  useBaseInternationalization: true
attributes:
  LastUpgradeCheck: "2640"
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "57UWRPUUGM"
    LOCALIZATION_EXPORT_SUPPORTED: YES
    STRINGS_FILE_GENERATE_SWIFT_SYMBOL: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
schemes:
  TrueRPCMini:
    build:
      targets:
        TrueRPCMini: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrueRPCMiniUnitTests
        - TrueRPCMiniIntegrationTests
  TrueRPCMiniUITests:
    build:
      targets:
        TrueRPCMini: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrueRPCMiniUITests
targets:
  TrueRPCMini:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - path: Resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.truewebber.TrueRPCMini
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        APP_SHORT_DESCRIPTION: "Dynamic gRPC client for exploring and testing services from .proto files."
        DEVELOPER_NAME: "Aleksei Kish"
        DEVELOPER_WEBSITE_URL: "https://truewebber.com"
        APP_GITHUB_URL: "https://github.com/truewebber/truerpc-mini"
        DEVELOPER_EMAIL: "support-mini@truerpc.app"
        INFOPLIST_KEY_CFBundleDisplayName: "TrueRPC-mini"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_STYLE: Automatic
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Inject Build Tool Versions
        basedOnDependencyAnalysis: false
        script: |
          set -e
          XCODE_VER=$(xcodebuild -version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          SWIFT_VER=$(xcrun swift --version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+(\.[0-9]+)?' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          /usr/libexec/PlistBuddy -c "Set :XcodeVersion ${XCODE_VER}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :SwiftVersion ${SWIFT_VER}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    dependencies:
      - package: SwiftProtoReflect
      - package: SwiftProtoParser
      - package: GRPCCore
      - package: GRPCNIOTransportHTTP2
      - package: Amplitude-Swift
        product: AmplitudeSwift
      - package: Sentry
        product: Sentry
      - package: Sparkle
        product: Sparkle
  TrueRPCMiniUnitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/UnitTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: TrueRPCMini
  TrueRPCMiniIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/IntegrationTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: TrueRPCMini
  TrueRPCMiniUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_STYLE: Manual
        Release:
          CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TrueRPCMini
packages:
  SwiftProtoReflect:
    url: https://github.com/truewebber/swift-protoreflect
    from: 5.1.0
  SwiftProtoParser:
    url: https://github.com/truewebber/swift-protoparser
    from: 0.5.0
  GRPCCore:
    url: https://github.com/grpc/grpc-swift-2.git
    from: 2.0.0
  GRPCNIOTransportHTTP2:
    url: https://github.com/grpc/grpc-swift-nio-transport.git
    from: 2.0.0
  Amplitude-Swift:
    url: https://github.com/amplitude/Amplitude-Swift
    from: "1.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.55.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"
