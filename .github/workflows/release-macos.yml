# Release macOS (signed + notarized)
# Triggered on push of tags matching v*
#
# Setup: Create environment "release" with Required reviewers (Settings → Environments)
# to protect Apple credentials from contributor MRs.
#
# Environment "release" (Settings → Environments → release):
#
# Secrets:
#   MACOS_CERT_P12_BASE64   — base64-encoded P12 (Keychain → Export → base64 -i cert.p12)
#   MACOS_CERT_PASSWORD     — P12 password
#   APPLE_ID                — Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD — App-specific password (appleid.apple.com)
#   AMPLITUDE_API_KEY       — Amplitude project API key (Analytics)
#   SENTRY_DSN              — Sentry project DSN (sentry.io → Settings → Projects → Client Keys)
#   SPARKLE_ED_PRIVATE_KEY  — base64-encoded Ed25519 private key for signing Sparkle update ZIPs
#                             (generate once with: ./bin/generate_keys from the Sparkle package)
#
# Variables:
#   MACOS_CODESIGN_IDENTITY — "Developer ID Application: Name (TEAMID)" (security find-identity -v)
#   APPLE_TEAM_ID           — Team ID from developer.apple.com
#   SPARKLE_ED_PUBLIC_KEY   — base64-encoded Ed25519 public key (companion to SPARKLE_ED_PRIVATE_KEY)

name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write

jobs:
  release_new_version:
    runs-on: macos-latest
    environment: release

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history required for git rev-list --count HEAD build number

      # 0) Create Secrets.xcconfig from env (AMPLITUDE_API_KEY, SENTRY_DSN, Sparkle keys)
      #
      # xcconfig treats "//" as a comment, so URLs with "https://" cannot be stored
      # directly. We strip the scheme and write only the remainder; Info.plist
      # reconstructs the full URL as https://$(…_REMAINDER).
      #
      # Variables:
      #   SPARKLE_ED_PUBLIC_KEY — EdDSA public key for Sparkle signature validation
      #                           (Settings → Variables → SPARKLE_ED_PUBLIC_KEY)
      - name: Create Secrets.xcconfig
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          mkdir -p Config
          {
            [ -n "$AMPLITUDE_API_KEY" ] && echo "AMPLITUDE_API_KEY = $AMPLITUDE_API_KEY"
            [ -n "$SENTRY_DSN" ] && echo "SENTRY_DSN_REMAINDER = ${SENTRY_DSN#https://}"
            echo "SPARKLE_APPCAST_URL_REMAINDER = truewebber.github.io/truerpc-mini/appcast.xml"
            [ -n "$SPARKLE_ED_PUBLIC_KEY" ] && echo "SPARKLE_ED_PUBLIC_KEY = $SPARKLE_ED_PUBLIC_KEY"
          } > Config/Secrets.xcconfig

      # 1) Generate Xcode project
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      # 1) Create & unlock a temporary keychain, import Developer ID cert
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 12)"

          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain_pass.txt"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Use -D for macOS compatibility (BSD base64)
          echo "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # Make this keychain the default for the job
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the key without UI prompts
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # 2) Set version from tag and commit
      # CURRENT_PROJECT_VERSION must be a monotonically increasing integer so that
      # Sparkle's version comparator can determine which build is newer.
      # git rev-list --count HEAD gives total commit count which always grows.
      - name: Set version
        run: |
          MARKETING_VERSION="${GITHUB_REF_NAME#v}"  # v0.3.0 → 0.3.0
          CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$CURRENT_PROJECT_VERSION" >> "$GITHUB_ENV"

      # 3) Build app (adhoc signing - we re-sign with Developer ID in next step)
      - name: Build (Release)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project TrueRPCMini.xcodeproj \
            -scheme TrueRPCMini \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build

      # 4) Codesign .app (hardened runtime)
      # Must be signed inside-out: nested bundles/executables before their parents.
      # Sparkle embeds XPC services, a nested Updater.app, and a standalone Autoupdate
      # binary that all require re-signing with Developer ID before notarization.
      - name: Codesign app
        env:
          CODESIGN_IDENTITY: ${{ vars.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release/TrueRPCMini.app"

          # 1. Sign all dylibs
          find "$APP_PATH" -name "*.dylib" -type f | while read -r f; do
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$f"
          done

          # 2. Sign XPC services nested inside frameworks (deepest first)
          find "$APP_PATH" -name "*.xpc" -type d | sort -r | while read -r f; do
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$f"
          done

          # 3. Sign .app bundles nested inside frameworks (e.g. Sparkle's Updater.app)
          find "$APP_PATH/Contents/Frameworks" -name "*.app" -type d | sort -r | while read -r f; do
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$f"
          done

          # 4. Sign standalone Mach-O executables inside frameworks
          # Skips files already covered by .app or .xpc bundle signing above
          # (e.g. signs Sparkle's Autoupdate helper binary)
          # NOTE: strip the prefix up to Contents/Frameworks/ before matching
          # so the main app's own .app/ component does not trigger the skip.
          FRAMEWORKS_PATH="$APP_PATH/Contents/Frameworks"
          find "$FRAMEWORKS_PATH" -type f | while read -r f; do
            relative="${f#$FRAMEWORKS_PATH/}"
            if echo "$relative" | grep -Eq '\.(app|xpc)/'; then continue; fi
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$f"
            fi
          done

          # 5. Sign frameworks (after all nested content is signed)
          find "$APP_PATH" -name "*.framework" -type d | sort | while read -r fw; do
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$fw"
          done

          # 6. Sign main app with entitlements
          codesign --force --options runtime --timestamp \
            --entitlements "Entitlements.plist" \
            --sign "$CODESIGN_IDENTITY" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      # 5) Package as DMG + ZIP
      - name: Package app (dmg + zip)
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release/TrueRPCMini.app"
          DMG_NAME="TrueRPCMini-${{ github.ref_name }}.dmg"
          ZIP_NAME="TrueRPCMini-${{ github.ref_name }}.zip"
          DMG_SRC="dmg_src"
          rm -rf "$DMG_SRC" && mkdir -p "$DMG_SRC"
          cp -R "$APP_PATH" "$DMG_SRC/"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          brew install create-dmg
          create-dmg \
            --volname "TrueRPCMini" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "TrueRPCMini.app" 120 150 \
            --app-drop-link 400 150 \
            --hide-extension "TrueRPCMini.app" \
            "$DMG_NAME" \
            "$DMG_SRC"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # 6) Sign ZIP with EdDSA and generate Sparkle appcast.xml
      # generate_appcast extracts version info from the app bundle inside the ZIP,
      # signs the archive with the EdDSA private key, and writes a ready-to-host appcast.xml.
      - name: Sign ZIP and generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euxo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set. Generate keys with ./bin/generate_keys from Sparkle."
            exit 1
          fi

          SPARKLE_VERSION="2.9.0"
          curl -sfL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o sparkle.tar.xz
          tar -xJf sparkle.tar.xz bin/generate_appcast
          chmod +x bin/generate_appcast

          # Stage only the update ZIP so generate_appcast processes a single item
          mkdir -p _sparkle_feed
          cp "$ZIP_NAME" _sparkle_feed/

          DOWNLOAD_PREFIX="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

          echo "$SPARKLE_ED_PRIVATE_KEY" | ./bin/generate_appcast \
            --ed-key-file - \
            --link "https://github.com/${{ github.repository }}" \
            --full-release-notes-url "$RELEASE_NOTES_URL" \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            -o appcast.xml \
            _sparkle_feed/

          echo "--- Generated appcast.xml ---"
          cat appcast.xml

      # 7) Notarize ZIP (Sparkle auto-update asset)
      # ZIP cannot be stapled — notarization ticket is verified by Gatekeeper online.
      - name: Notarize ZIP (notarytool)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300 2>/dev/null || true
          OUTPUT=$(xcrun notarytool submit "$ZIP_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          echo "$OUTPUT"
          SUBMISSION=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          xcrun notarytool wait "$SUBMISSION" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          STATUS=$(xcrun notarytool info "$SUBMISSION" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 | grep "status:" | awk '{print $2}')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::ZIP notarization failed with status: $STATUS"
            echo "--- Notary log ---"
            xcrun notarytool log "$SUBMISSION" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 || true
            exit 1
          fi

      # 8) Notarize DMG
      - name: Notarize DMG (notarytool)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          # Increase upload timeout (helps with slow/large uploads)
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300 2>/dev/null || true
          # Submit (without --wait) — if this hangs, upload/connection is the issue
          OUTPUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1)
          echo "$OUTPUT"
          SUBMISSION=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          # Wait for Apple to process (typically 1–5 min, can be 30+)
          xcrun notarytool wait "$SUBMISSION" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          # Fail if not Accepted (notarytool wait exits 0 even on Invalid)
          STATUS=$(xcrun notarytool info "$SUBMISSION" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 | grep "status:" | awk '{print $2}')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::DMG notarization failed with status: $STATUS"
            echo "--- Notary log ---"
            xcrun notarytool log "$SUBMISSION" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 || true
            exit 1
          fi

      # 9) Staple notarization ticket onto DMG (ZIP cannot be stapled)
      - name: Staple DMG
        run: |
          set -euxo pipefail
          xcrun stapler staple "$DMG_NAME"

      # 10) Create GitHub Release + upload assets
      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TrueRPCMini-${{ github.ref_name }}.dmg
            TrueRPCMini-${{ github.ref_name }}.zip

      # 11) Publish appcast.xml to gh-pages
      # Hosts the Sparkle feed at https://truewebber.github.io/truerpc-mini/appcast.xml
      # Enable GitHub Pages for the gh-pages branch in Settings → Pages.
      - name: Publish appcast.xml to gh-pages
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code "$REPO_URL" gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REPO_URL" _gh_pages
          else
            mkdir -p _gh_pages
            git -C _gh_pages init
            git -C _gh_pages remote add origin "$REPO_URL"
            git -C _gh_pages checkout --orphan gh-pages
          fi

          cp appcast.xml _gh_pages/appcast.xml
          touch _gh_pages/.nojekyll

          git -C _gh_pages add appcast.xml .nojekyll
          git -C _gh_pages diff --cached --quiet \
            && echo "appcast.xml unchanged, skipping push" \
            && exit 0
          git -C _gh_pages commit -m "Update appcast.xml for ${{ github.ref_name }}"
          git -C _gh_pages push origin gh-pages
